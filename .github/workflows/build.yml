name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Configuration, glossary, and Gloss wiring checks. Needs neither OODT nor
  # the translation model. Java unit tests for Gloss run in the package job.
  config:
    name: Configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test
        run: python -m pytest tests/ -v

  # Packaging check. Mnemosyne resolves from Maven Central as
  # ai.mattmann.mnemosyne:1.11.0, so there is nothing to build from source.
  package:
    name: Maven package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: webapps/gloss/src/main/webapp/resources/package-lock.json

      - name: Package BigTranslate
        run: mvn -B package

      - name: Check the distribution contents
        run: |
          set -e
          TARBALL=distribution/target/bigtranslate-distribution-*-bin.tar.gz
          test -f $TARBALL

          # The translation step and its glossary have to ship, and the shim
          # has to arrive executable or the PGE cannot invoke it.
          tar tvzf $TARBALL | grep -E 'bin/pantogloss-translatejson' | grep -q '^-rwx'
          tar tzf  $TARBALL | grep -q 'conf/glossary.es-en.tsv'

          # Tomcat 9 ships bin/*.sh non-executable through the fileSet unless
          # they are re-added with an explicit mode.
          tar tvzf $TARBALL | grep -E 'tomcat/bin/catalina.sh' | grep -q '^-rwx'

          # Gloss is the GUI; Tomcat's ROOT sends people there.
          # The assembly has no base directory, so these paths are not
          # prefixed: */tomcat/... does not match tomcat/...
          tar tzf $TARBALL | grep -q 'tomcat/webapps/gloss/index.html'
          tar tzf $TARBALL | grep -q 'tomcat/webapps/gloss-services/WEB-INF/web.xml'
          tar tzf $TARBALL | grep -q 'tomcat/webapps/ROOT/index.jsp'
          tar xzOf $TARBALL tomcat/webapps/ROOT/index.jsp | grep -q '/gloss/'

          # Java 9 removed the extension mechanism; every launcher that still
          # references it fails at startup. Assert the scan is non-vacuous
          # first, so a wildcard that matches nothing cannot pass silently.
          LAUNCHERS=$(tar tzf $TARBALL | grep -cE '^[^/]+/bin/[^/]+$')
          echo "scanning $LAUNCHERS launcher scripts"
          test "$LAUNCHERS" -gt 30
          ! tar xzOf $TARBALL --wildcards '*/bin/*' 2>/dev/null | grep -q 'java.ext.dirs'

          echo "distribution contents OK"
