name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Configuration, glossary, and Gloss wiring checks. Needs neither OODT nor
  # the translation model. Java unit tests for Gloss run in the package job.
  config:
    name: Configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test
        run: python -m pytest tests/ -v

  # Packaging check. Mnemosyne resolves from Maven Central as
  # ai.mattmann.mnemosyne:1.11.0, so there is nothing to build from source.
  package:
    name: Maven package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: webapps/gloss/src/main/webapp/resources/package-lock.json

      # Javadoc is attached to the package phase for releases. Nothing in CI
      # reads it, and generating it for every module on every pull request was
      # a large share of this job.
      - name: Package BigTranslate
        run: mvn -B package -Dmaven.javadoc.skip=true

      - name: Check the distribution contents
        run: |
          set -e
          TARBALL=$(ls distribution/target/bigtranslate-distribution-*-bin.tar.gz)
          test -f "$TARBALL"

          # Unpacked once. Every check below used to re-inflate the whole
          # archive -- Tomcat, Solr and every jar -- and there were nine of
          # them, which was most of the time this step took. The checks are
          # the same; they are just no longer paid for one at a time.
          DIR=$(mktemp -d)
          trap 'rm -rf "$DIR"' EXIT
          tar xzf "$TARBALL" -C "$DIR"

          # The translation step and its glossary have to ship, and the shim
          # has to arrive executable or the PGE cannot invoke it. Asking the
          # unpacked file is a more direct question than reading a mode out of
          # a listing, and it is the mode that will actually be on disk.
          test -x "$DIR/bin/pantogloss-translatejson"
          test -f "$DIR/conf/glossary.es-en.tsv"

          # Tomcat 9 ships bin/*.sh non-executable through the fileSet unless
          # they are re-added with an explicit mode.
          test -x "$DIR/tomcat/bin/catalina.sh"

          # Gloss is the GUI; Tomcat's ROOT sends people there.
          test -f "$DIR/tomcat/webapps/gloss/index.html"
          test -f "$DIR/tomcat/webapps/gloss-services/WEB-INF/web.xml"
          test -f "$DIR/tomcat/webapps/ROOT/index.jsp"
          grep -q '/gloss/' "$DIR/tomcat/webapps/ROOT/index.jsp"

          # Java 9 removed the extension mechanism; every launcher that still
          # references it fails at startup. Assert the scan is non-vacuous
          # first, so a pattern that matches nothing cannot pass silently.
          LAUNCHERS=$(find "$DIR" -mindepth 3 -maxdepth 3 -path '*/bin/*' -type f | wc -l)
          echo "scanning $LAUNCHERS launcher scripts"
          test "$LAUNCHERS" -gt 30
          if find "$DIR" -mindepth 3 -maxdepth 3 -path '*/bin/*' -type f \
               -exec grep -l 'java.ext.dirs' {} + | grep -q .; then
            echo "a launcher still references java.ext.dirs, removed in Java 9"
            exit 1
          fi

          echo "distribution contents OK"
