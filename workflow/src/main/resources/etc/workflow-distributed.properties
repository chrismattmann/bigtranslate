# Overrides that put the translate stage on the resource manager.
#
# Concatenated onto workflow.properties by bin/wmgr when WORKFLOW_RUNNER is
# "resource"; later keys win, so only the differences belong here.
#
# What changes: instead of running a task in a local thread, the engine
# submits it to the resource manager, which hands it to whichever node has
# capacity in the task's queue. The node runs a batch stub, and the stub is
# what actually instantiates the task -- so every node needs the same
# deployment, not just the stub.

workflow.wengine.runner.factory = org.apache.oodt.cas.workflow.engine.runner.ResourceRunnerFactory

# Read through PathUtils, so the deployment's RESMGR_URL is picked up.
org.apache.oodt.cas.workflow.engine.resourcemgr.url = [RESMGR_URL]
