# Properties required to configure the Workflow Manager

# RPC implementation
workflow.server.factory = org.apache.oodt.cas.workflow.system.rpc.AvroRpcWorkflowManagerFactory
workflow.client.factory = org.apache.oodt.cas.workflow.system.rpc.AvroRpcWorkflowManagerFactory

# workflow repository factory
workflow.repo.factory = org.apache.oodt.cas.workflow.repository.XMLWorkflowRepositoryFactory

# workflow engine factory
# The queue-based engine, not the thread pool one. The pipeline it runs is
# three stages -- extract distinct strings, translate them, join and index --
# and only the middle stage is expensive. A prioritised queue lets the
# translate chunks be handed out as nodes free up, which the thread pool
# engine cannot do because it binds an instance to a thread for its life.
workflow.engine.factory = org.apache.oodt.cas.workflow.engine.PrioritizedQueueBasedWorkflowEngineFactory

# First in, first out among equal priorities. The chunks are all the same
# size and carry no ordering, so there is nothing to be cleverer about, and
# a FIFO makes a stalled run obvious: the oldest chunk is the stuck one.
org.apache.oodt.cas.workflow.wengine.prioritizer = org.apache.oodt.cas.workflow.structs.HighestFIFOPrioritySorter

# Local by default. Swap to the ResourceRunnerFactory to spread the
# translate stage across nodes through the resource manager; nothing else
# in the pipeline needs to change for that, because a chunk holds no state
# beyond its own output file.
workflow.wengine.runner.factory = org.apache.oodt.cas.workflow.engine.runner.AsynchronousLocalEngineRunnerFactory
org.apache.oodt.cas.workflow.wengine.asynchronous.runner.num.threads=8

# How long the querier sleeps when it finds nothing runnable. Two seconds
# is the default and is far too eager for a run whose stages are minutes
# long; ten keeps it from spinning through a long translate stage.
org.apache.oodt.cas.workflow.wengine.taskquerier.waitSeconds=10

# workflow instance repository factory
workflow.engine.instanceRep.factory = org.apache.oodt.cas.workflow.instrepo.LuceneWorkflowInstanceRepositoryFactory

# thread pool workflow engine properties
org.apache.oodt.cas.workflow.engine.queueSize=
org.apache.oodt.cas.workflow.engine.maxPoolSize=10
org.apache.oodt.cas.workflow.engine.minPoolSize=8
org.apache.oodt.cas.workflow.engine.threadKeepAlive.minutes=1
org.apache.oodt.cas.workflow.engine.unlimitedQueue=true
org.apache.oodt.cas.workflow.engine.preConditionWaitTime=1

# set this if you want the workflow manager to submit jobs through the resource mgr
# Submit jobs through the resource manager. Left disabled: with it on, the
# workflow manager hands tasks to the Resource Manager and instances sit in
# RSUBMIT unless nodes and queues are provisioned. DRAT reached the same
# conclusion in drat@c767f389 and runs workflows locally by default.
#org.apache.oodt.cas.workflow.engine.resourcemgr.url=[RESMGR_URL]

# if you use the resource mgr submission, you can specify how many seconds the 
# workflow manager should wait inbetween checking to see if a job is complete
org.apache.oodt.cas.workflow.engine.resourcemgr.pollingWaitTime=10

# workflow instance repository general properties
# default page size to page through WorkflowInstances with
org.apache.oodt.cas.workflow.instanceRep.pageSize=20

# lucene workflow instance repository properties
org.apache.oodt.cas.workflow.instanceRep.lucene.idxPath=[OODT_HOME]/data/workflow

# data source workflow instance repository properties
# org.apache.oodt.cas.workflow.instanceRep.datasource.jdbc.url=jdbc:url
# org.apache.oodt.cas.workflow.instanceRep.datasource.jdbc.user=user
# org.apache.oodt.cas.workflow.instanceRep.datasource.jdbc.pass=pass
# org.apache.oodt.cas.workflow.instanceRep.datasource.jdbc.driver=your.jdbc.Driver
# org.apache.oodt.cas.workflow.instanceRep.datasource.quoteFields=false

# XML workflow repository properties
org.apache.oodt.cas.workflow.repo.dirs=file://[WORKFLOW_HOME]/policy

# wengine-style packaged workflow repo properties
#org.apache.oodt.cas.workflow.wengine.packagedRepo.dir.path = /path/to/wengine/workflow/files

# data source workflow repository properties
# org.apache.oodt.cas.workflow.repo.datasource.jdbc.url=jdbc:url
# org.apache.oodt.cas.workflow.repo.datasource.jdbc.user=user
# org.apache.oodt.cas.workflow.repo.datasource.jdbc.pass=pass
# org.apache.oodt.cas.workflow.repo.datasource.jdbc.driver=your.jdbc.Driver

# Spring command line option and action store properties
org.apache.oodt.cas.cli.action.spring.config=file://[WORKFLOW_HOME]/policy/cmd-line-actions.xml
org.apache.oodt.cas.cli.option.spring.config=file://[WORKFLOW_HOME]/policy/cmd-line-options.xml

# workflow lifecycle Manager
org.apache.oodt.cas.workflow.lifecycle.filePath=[WORKFLOW_HOME]/policy/workflow-lifecycle.xml

# Avro client request bound is a JVM system property:
# org.apache.oodt.avro.client.requestTimeoutMillis (set in bin/setenv.sh).

# How long the task runner idles when it has nothing to hand out. The
# queue is short -- a few hundred chunks -- and the stages are minutes
# long, so there is no reason to poll it hard.
org.apache.oodt.cas.workflow.wengine.taskrunner.idleWaitMillis=500

# The packaged repository is a different way of declaring workflows, in its
# own directory rather than the XML policy this deployment uses. Left off:
# the three stages here are declared in policy/ alongside everything else.
# org.apache.oodt.cas.workflow.wengine.packagedRepo.dir.path=/path/to/wengine/workflow/files
# org.apache.oodt.cas.workflow.wengine.packagedRepo.parallelProcessors=false
